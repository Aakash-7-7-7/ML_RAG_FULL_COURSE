<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Data Analyst</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="app-container">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">AI</div>

            <div>
                <h2>Data Analyst</h2>
                <span>AI Assistant</span>
            </div>
        </div>


        <button
            id="newChatBtn"
            class="new-chat-btn"
        >
            + New Chat
        </button>


        <div class="sidebar-section">

            <p class="section-title">
                DATASET
            </p>


            <label
                for="datasetInput"
                class="upload-box"
            >

                <span class="upload-icon">
                    ↑
                </span>

                <span>
                    Upload CSV
                </span>

                <input
                    type="file"
                    id="datasetInput"
                    accept=".csv"
                    hidden
                >

            </label>


            <div
                id="datasetInfo"
                class="dataset-info"
            >
                No dataset loaded
            </div>

        </div>


        <div class="sidebar-bottom">

            <p class="conversation-label">
                CURRENT CHAT
            </p>

            <div
                id="conversationIdDisplay"
                class="conversation-id"
            >
                Creating...
            </div>

        </div>

    </aside>



    <!-- =========================
         MAIN CHAT AREA
    ========================== -->

    <main class="main-chat">


        <!-- HEADER -->

        <header class="chat-header">

            <div>

                <h1>
                    AI Data Analyst
                </h1>

                <p>
                    Ask questions about your dataset
                </p>

            </div>


            <div class="status">

                <span class="status-dot"></span>

                <span>
                    Online
                </span>

            </div>

        </header>



        <!-- MESSAGES -->

        <section
            id="chatMessages"
            class="chat-messages"
        >

            <div class="welcome-message">

                <div class="welcome-icon">
                    📊
                </div>

                <h2>
                    Start analyzing your data
                </h2>

                <p>
                    Upload a CSV file and ask questions about your dataset.
                </p>

                <div class="suggestions">

                    <button
                        class="suggestion-btn"
                    >
                        Give me an overview of this dataset
                    </button>

                    <button
                        class="suggestion-btn"
                    >
                        What are the important insights?
                    </button>

                    <button
                        class="suggestion-btn"
                    >
                        Create a visualization
                    </button>

                </div>

            </div>

        </section>



        <!-- INPUT -->

        <div class="chat-input-container">

            <div class="chat-input-wrapper">

                <textarea
                    id="messageInput"
                    placeholder="Ask something about your data..."
                    rows="1"
                ></textarea>


                <button
                    id="sendBtn"
                    class="send-btn"
                >
                    ➤
                </button>

            </div>


            <p class="input-hint">

                Press Enter to send • Shift + Enter for a new line

            </p>

        </div>


    </main>

</div>


<script src="app.js"></script>

</body>
</html>
